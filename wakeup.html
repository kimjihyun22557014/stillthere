<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#362744">
<title>Wake Up — Are You Still There?</title>
<link rel="preload" as="image" href="images/wake-rising.webp" fetchpriority="high">
<link rel="stylesheet" href="css/style.css?v=reflection-1">
<link rel="stylesheet" href="css/wakeup.css">

<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "zbtir1514e");
</script>
</head>
<body class="wakeup-body">
<main class="wakeup-stage" aria-label="낯선 호텔에서 깨어나는 장면">
  <div class="wakeup-canvas eyes-shut" id="wakeupCanvas">
    <div class="wakeup-scene" id="wakeupScene" aria-hidden="true">
      <img id="sceneImage" src="images/wake-rising.webp" alt="" fetchpriority="high" decoding="async" draggable="false">
    </div>
    <div class="wakeup-shade" aria-hidden="true"></div>
    <div class="wakeup-eyelid eyelid-top" aria-hidden="true"></div>
    <div class="wakeup-eyelid eyelid-bottom" aria-hidden="true"></div>
    <div class="wakeup-dialogue" id="dialogue" aria-live="polite" hidden>
      <p class="wakeup-line" id="dialogueText">여기가 어디지?</p>
      <button class="wakeup-next" id="nextDialogue" type="button" aria-label="다음 대사로 넘어가기">➜</button>
    </div>
    <a href="corridor.html" class="wakeup-door" id="roomDoor" aria-label="문을 열고 복도로 나가기" hidden><span class="sr-only">문을 열고 복도로 나가기</span></a>
    <span class="wakeup-door-hint" id="doorHint" hidden>문을 눌러 나가세요</span>
  </div>
  <a href="corridor.html" class="wakeup-skip" aria-label="도입 장면 건너뛰기">SKIP →</a>
</main>
<script src="js/wakeup.js"></script>
</body>
</html>
